name: ghro self-test

# workflow_dispatch only, deliberately. This repository is public, and a
# self-hosted runner must never be reachable from a fork's pull request —
# that would let anyone execute code on the machine hosting the runner.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: [self-hosted, ghro-e2e]
    steps:
      - name: Report the machine this job landed on
        run: |
          echo "runner name : ${RUNNER_NAME}"
          echo "runner os   : ${RUNNER_OS}/${RUNNER_ARCH}"
          echo "hostname    : $(hostname)"
          echo "user        : $(id -un)"
          echo "workdir     : ${PWD}"
          echo "cpus        : $(nproc)"
          nvidia-smi --query-gpu=name,memory.total --format=csv,noheader || echo "gpu         : none"

      - name: Stay busy long enough for the orchestrator to observe the transition
        run: |
          for i in $(seq 1 6); do
            echo "working ${i}/6"
            sleep 5
          done
          echo "done"
