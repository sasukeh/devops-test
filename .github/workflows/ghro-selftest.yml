name: ghro self-test

# workflow_dispatch only: this repository is public, and a self-hosted runner
# must never be reachable from a fork's pull request.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: [self-hosted, ghro-test]
    steps:
      - name: Report the machine this job landed on
        run: |
          echo "runner  : ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          echo "host    : $(hostname) as $(id -un)"
          echo "cpus    : $(nproc)"
          nvidia-smi --query-gpu=name,memory.total --format=csv,noheader || echo "gpu     : none"
      - name: Stay busy long enough to observe the transition
        run: for i in $(seq 1 6); do echo "working $i/6"; sleep 5; done
